<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スイング再生ツール</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background:#000; }
  video, #dcanvas { position:absolute; max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .mirror { transform: scaleX(-1); }
  .hidden { display: none !important; }

  #modes { position: fixed; top: calc(env(safe-area-inset-top) + 10px); left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); }
  #modes button { padding: 8px 13px; border-radius: 999px; border: none; background: transparent; color: #ddd;
    font-size: 13px; font-weight: 700; white-space: nowrap; }
  #modes button.on { background: #fff; color: #000; }

  #badge { position: fixed; top: calc(env(safe-area-inset-top) + 58px); left: 50%; transform: translateX(-50%);
    padding: 5px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: .04em;
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px); white-space: nowrap; }
  #badge.live { color: #6ee7ff; } #badge.rec { color: #ff5a5a; }
  #badge.play { color: #7dff8a; } #badge.wait { color: #ffd166; }
  #dot { display:inline-block; width:9px; height:9px; border-radius:50%; background: currentColor; margin-right:7px; vertical-align: 1px; }
  #badge.rec #dot, #badge.wait #dot { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  #controls { position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px);
    display: flex; flex-direction: column; gap: 11px;
    background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); }
  .row { display: flex; align-items: center; justify-content: center; gap: 12px; }

  #meter { height: 6px; border-radius: 999px; background: rgba(255,255,255,.15); overflow: hidden; }
  #meterFill { height: 100%; width: 0%; background: #6ee7ff; transition: width .05s linear; }
  #meter.hot #meterFill { background: #ff5a5a; }

  #recBtn { width: 78px; height: 78px; border-radius: 50%; border: 5px solid #fff; background: #ff3b30; flex: 0 0 auto; transition: border-radius .15s; }
  #recBtn:active { transform: scale(.94); } #recBtn.active { border-radius: 18px; }

  .side { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; }
  .side button { width: 56px; height: 56px; border-radius: 50%; border: none; background: rgba(255,255,255,.15); color:#fff; font-size: 22px; }
  .side button:active { background: rgba(255,255,255,.3); }
  .side span { font-size: 11px; color:#cfcfcf; }

  .pills { display:flex; gap:8px; justify-content:center; flex-wrap: wrap; }
  .pills .label { font-size:12px; color:#999; align-self:center; margin-right:2px; }
  .pills button { padding: 6px 12px; border-radius: 999px; border:1px solid rgba(255,255,255,.25); background: transparent; color:#fff; font-size: 13px; font-weight:600; }
  .pills button.on { background:#fff; color:#000; border-color:#fff; }

  #hint { text-align:center; font-size:12px; color:#bbb; min-height: 15px; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px; text-align: center; background: #000; z-index: 10; }
  #start h1 { font-size: 22px; margin: 0; }
  #start p { color:#bbb; font-size: 14px; margin: 0; max-width: 330px; line-height: 1.6; }
  #startBtn { padding: 16px 34px; border-radius: 999px; border:none; background:#6ee7ff; color:#000; font-size: 17px; font-weight: 700; }
  #err { color:#ff8a8a; font-size:13px; max-width: 330px; }
</style>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="dcanvas" class="hidden"></canvas>
</div>

<div id="modes">
  <button id="modeAuto" class="on">自動スイング</button>
  <button id="modeRecord">録画再生</button>
  <button id="modeDelay">遅延ミラー</button>
</div>

<div id="badge" class="wait"><span id="dot"></span><span id="badgeText">準備中</span></div>

<div id="controls">
  <div id="hint"></div>
  <div id="meter" class="hidden"><div id="meterFill"></div></div>

  <div class="pills" id="speeds">
    <span class="label">速度</span>
    <button data-speed="0.25">0.25x</button>
    <button data-speed="0.5" class="on">0.5x</button>
    <button data-speed="1">1x</button>
  </div>

  <div class="pills hidden" id="sens">
    <span class="label">感度</span>
    <button data-sens="high">高</button>
    <button data-sens="mid" class="on">中</button>
    <button data-sens="low">低</button>
  </div>

  <div class="pills hidden" id="delays">
    <span class="label">遅延</span>
    <button data-delay="2000">2秒</button>
    <button data-delay="4000" class="on">4秒</button>
    <button data-delay="6000">6秒</button>
  </div>

  <div class="row">
    <div class="side"><button id="flipBtn">⟳</button><span>カメラ</span></div>
    <button id="recBtn" class="hidden"></button>
    <div class="side"><button id="liveBtn">▶</button><span id="liveLabel">待機</span></div>
  </div>
</div>

<div id="start">
  <h1>⛳ スイング再生ツール</h1>
  <p>カメラを許可すると、すぐにアドレス検出が始まります。アドレスして静止→スイングすると自動で撮影・スロー再生。再生後は次のアドレスを取れば自動で次のスイングを撮影します。スマホは三脚などで固定してください。</p>
  <button id="startBtn">開始（再試行）</button>
  <div id="err"></div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const video=$('#video'), dcanvas=$('#dcanvas'), dctx=dcanvas.getContext('2d');
  const badge=$('#badge'), badgeText=$('#badgeText');
  const recBtn=$('#recBtn'), flipBtn=$('#flipBtn'), liveBtn=$('#liveBtn'), liveLabel=$('#liveLabel');
  const hint=$('#hint'), startEl=$('#start'), startBtn=$('#startBtn'), errEl=$('#err');
  const meter=$('#meter'), meterFill=$('#meterFill');
  const speedsEl=$('#speeds'), sensEl=$('#sens'), delaysEl=$('#delays');
  const modeAutoBtn=$('#modeAuto'), modeRecordBtn=$('#modeRecord'), modeDelayBtn=$('#modeDelay');
  const speedBtns=[...speedsEl.querySelectorAll('button')];
  const sensBtns=[...sensEl.querySelectorAll('button')];
  const delayBtns=[...delaysEl.querySelectorAll('button')];

  let stream=null, facing='environment', uiMode='auto';

  // 録画モード
  let recorder=null, chunks=[], recording=false, playbackURL=null, recState='live', maxSec=8, autoStopTimer=null;
  // 共通
  let playSpeed=0.5;
  // リングバッファ（遅延・自動で共用）
  let ring=[], ringSize=0, ringIdx=0, capW=0, capH=0, lastCap=0, rafId=0;
  // 遅延ミラー
  let delayMs=4000;
  // 自動スイング
  const AUTO_FPS=30, AUTO_SECONDS=8, DW=64, DH=36;
  const detCanvas=document.createElement('canvas'); detCanvas.width=DW; detCanvas.height=DH;
  const detCtx=detCanvas.getContext('2d', { willReadFrequently:true });
  let prevGray=null, curGray=new Float32Array(DW*DH), lastMotion=0;
  let autoState='idle';        // 'address' | 'ready' | 'recording' | 'playing'
  let swingStart=0, lastHigh=0, playRaf=0, stillStart=0;
  let clipFrames=[];
  const SENS={ high:{start:2.5}, mid:{start:5}, low:{start:9} };   // 変化ピクセル%のしきい値
  let startThresh=SENS.mid.start, endThresh=startThresh*0.5;
  const PRE_ROLL=1500, POST_ROLL=900, END_HOLD=900, MIN_SWING=300, MAX_LOOPS=3, MAX_SWING=6000;
  const STILL_THRESH=1.0, STILL_MS=600;   // アドレス（静止）判定
  const ADDRESS_TIMEOUT=10000;            // 静止が取れなくても10秒でスタンバイへ
  let addressStart=0;

  function setBadge(s,t){ badge.className=s; badgeText.textContent=t; }
  function isMirror(){ return facing==='user'; }
  function applyMirror(){ video.classList.toggle('mirror',isMirror()); dcanvas.classList.toggle('mirror',isMirror()); }

  async function startCamera(){
    if (stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{ facingMode:facing, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:60} }});
    applyMirror();
    if (uiMode==='delay') enterDelay();
    else if (uiMode==='auto') enterAuto();
    else goLive();
  }

  /* ---------- リングバッファ ---------- */
  function initRing(fps, seconds){
    const vw=video.videoWidth||640, vh=video.videoHeight||360;
    const scale=Math.min(1, 640/Math.max(vw,vh));
    capW=Math.max(2,Math.round(vw*scale)); capH=Math.max(2,Math.round(vh*scale));
    dcanvas.width=capW; dcanvas.height=capH;
    ringSize=Math.ceil(fps*(seconds+0.5)); ring=[];
    for(let i=0;i<ringSize;i++){ const c=document.createElement('canvas'); c.width=capW; c.height=capH;
      ring.push({ canvas:c, ctx:c.getContext('2d'), t:-1 }); }
    ringIdx=0; lastCap=0;
  }
  function whenReady(fn){ if (video.videoWidth) fn(); else video.addEventListener('loadedmetadata', fn, {once:true}); }

  /* ---------- 録画モード ---------- */
  function goLive(){
    recState='live';
    if (playbackURL){ URL.revokeObjectURL(playbackURL); playbackURL=null; }
    video.loop=false; video.muted=true; video.srcObject=stream; video.src=''; video.playbackRate=1;
    video.play().catch(()=>{});
    recBtn.classList.remove('active');
    setBadge('live','ライブ');
    hint.textContent='録画ボタンでスイングを撮影 → 停止で自動スロー再生';
  }
  function pickMime(){ for (const m of ['video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; return ''; }
  function startRecording(){
    if (recState!=='live') goLive();
    chunks=[]; const mime=pickMime();
    try { recorder=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }
    catch(e){ hint.textContent='録画に対応していない可能性があります: '+e.message; return; }
    recorder.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    recorder.onstop=onRecordingStop; recorder.start(); recording=true;
    recBtn.classList.add('active'); setBadge('rec','録画中');
    hint.textContent='もう一度押すと停止（'+maxSec+'秒で自動停止）';
    autoStopTimer=setTimeout(stopRecording, maxSec*1000);
  }
  function stopRecording(){ if(!recording) return; clearTimeout(autoStopTimer); recording=false; recBtn.classList.remove('active'); try{recorder.stop();}catch(e){} }
  function onRecordingStop(){
    if(!chunks.length){ goLive(); return; }
    const blob=new Blob(chunks,{type:chunks[0].type||'video/webm'});
    if(playbackURL) URL.revokeObjectURL(playbackURL);
    playbackURL=URL.createObjectURL(blob); recState='playback';
    video.srcObject=null; video.src=playbackURL; video.loop=true; video.muted=true; video.playbackRate=playSpeed;
    video.play().catch(()=>{});
    setBadge('play','再生中 '+playSpeed+'x');
    hint.textContent='繰り返し再生中。速度変更や「ライブ」で撮り直せます';
  }

  /* ---------- 遅延ミラー ---------- */
  function enterDelay(){
    if (recState!=='live') goLive();
    video.classList.add('hidden'); dcanvas.classList.remove('hidden');
    setBadge('wait','バッファ中…');
    hint.textContent='数秒遅れで映ります。スイングしてから画面を見てください';
    whenReady(()=>{ initRing(20,6); cancelAnimationFrame(rafId); rafId=requestAnimationFrame(delayLoop); });
  }
  function exitDelay(){ cancelAnimationFrame(rafId); dcanvas.classList.add('hidden'); video.classList.remove('hidden'); }
  function delayLoop(now){
    if (uiMode!=='delay') return;
    if (now-lastCap >= 1000/20){ lastCap=now; const s=ring[ringIdx%ringSize];
      try{ s.ctx.drawImage(video,0,0,capW,capH); s.t=now; ringIdx++; }catch(e){} }
    const target=now-delayMs; let best=null,bestDiff=Infinity,earliest=Infinity;
    for(const s of ring){ if(s.t<0) continue; if(s.t<earliest) earliest=s.t;
      const d=Math.abs(s.t-target); if(s.t<=now && d<bestDiff){ bestDiff=d; best=s; } }
    if (best && earliest<=target){ dctx.drawImage(best.canvas,0,0,capW,capH);
      if(badge.className!=='play') setBadge('play','遅延 '+(delayMs/1000)+'秒'); }
    else dctx.drawImage(video,0,0,capW,capH);
    rafId=requestAnimationFrame(delayLoop);
  }

  /* ---------- 自動スイング ---------- */
  function enterAuto(){
    if (recState!=='live') goLive();
    video.classList.add('hidden'); dcanvas.classList.remove('hidden'); meter.classList.remove('hidden');
    whenReady(()=>{ initRing(AUTO_FPS, AUTO_SECONDS); prevGray=null; startWaitAddress(); });
  }
  function exitAuto(){ cancelAnimationFrame(rafId); cancelAnimationFrame(playRaf); autoState='idle';
    dcanvas.classList.add('hidden'); video.classList.remove('hidden'); meter.classList.add('hidden'); clipFrames=[]; }

  function startWaitAddress(){
    cancelAnimationFrame(playRaf);
    autoState='address'; swingStart=0; lastHigh=0; stillStart=0; addressStart=0; prevGray=null;
    setBadge('wait','アドレス待ち…');
    hint.textContent='アドレスして構えて静止してください';
    cancelAnimationFrame(rafId); rafId=requestAnimationFrame(autoLoop);
  }

  function computeMotion(){
    // 「変化したピクセルの割合(%)」で動きを測る（ノイズに強い）
    detCtx.drawImage(video,0,0,DW,DH);
    const d=detCtx.getImageData(0,0,DW,DH).data; let changed=0;
    for(let i=0,idx=0;i<d.length;i+=4,idx++){
      const g=d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11;
      if(prevGray && Math.abs(g-prevGray[idx])>28) changed++;
      curGray[idx]=g;
    }
    const m = prevGray ? changed/(DW*DH)*100 : 0;
    const tmp=prevGray; prevGray=curGray; curGray=tmp||new Float32Array(DW*DH);
    return m;
  }

  function autoLoop(now){
    if (uiMode!=='auto' || autoState==='playing') return;
    if (now-lastCap >= 1000/AUTO_FPS){
      lastCap=now;
      const s=ring[ringIdx%ringSize];
      try{ s.ctx.drawImage(video,0,0,capW,capH); s.t=now; ringIdx++; }catch(e){}
      lastMotion=computeMotion();
      // メーター表示
      const pct=Math.min(100, lastMotion/startThresh*70);
      meterFill.style.width=pct+'%';
      meter.classList.toggle('hot', lastMotion>=startThresh);
      handleState(lastMotion, now);
    }
    dctx.drawImage(video,0,0,capW,capH);
    if (autoState!=='playing') rafId=requestAnimationFrame(autoLoop);
  }

  function handleState(m, now){
    if (autoState==='address'){
      if (!addressStart) addressStart=now;
      // 静止が STILL_MS 続いたらアドレス確立（取れなくても10秒でスタンバイ）
      if (m < STILL_THRESH){
        if (!stillStart) stillStart=now;
        else if (now-stillStart>=STILL_MS){ autoState='ready';
          setBadge('live','アドレスOK・どうぞ'); hint.textContent='そのままスイングしてください'; }
      } else stillStart=0;
      if (autoState==='address' && now-addressStart>=ADDRESS_TIMEOUT){ autoState='ready';
        setBadge('live','スタンバイ・どうぞ'); hint.textContent='スイングすると自動で撮影します'; }
    } else if (autoState==='ready'){
      if (m>=startThresh){ autoState='recording'; swingStart=now; lastHigh=now;
        setBadge('rec','スイング検出中'); hint.textContent='検出中…'; }
    } else if (autoState==='recording'){
      if (m>=endThresh) lastHigh=now;
      if (now-lastHigh>=END_HOLD){
        const dur=lastHigh-swingStart;
        if (dur>=MIN_SWING) finalizeClip(now);
        else startWaitAddress();     // 誤検出は破棄して再待機
      } else if (now-swingStart>MAX_SWING){ finalizeClip(now); } // 長すぎる場合は打ち切り
    }
  }

  function finalizeClip(now){
    const from=swingStart-PRE_ROLL, to=lastHigh+POST_ROLL;
    const frames=ring.filter(s=>s.t>=from && s.t<=Math.min(to,now)).sort((a,b)=>a.t-b.t);
    if (frames.length<3){ startWaitAddress(); return; }
    clipFrames=frames;
    playClip();
  }

  function playClip(){
    cancelAnimationFrame(rafId);
    autoState='playing';
    const clipStart=clipFrames[0].t;
    const clipDur=Math.max(1, clipFrames[clipFrames.length-1].t - clipStart);
    let loops=0, segStart=performance.now();
    setBadge('play','自動再生 '+playSpeed+'x');
    hint.textContent='スイングを再生中（自動で待機に戻ります）';
    meterFill.style.width='0%'; meter.classList.remove('hot');
    function loop(now){
      if (autoState!=='playing') return;
      let vt=(now-segStart)*playSpeed;
      if (vt>=clipDur){ loops++; if (loops>=MAX_LOOPS){ startWaitAddress(); return; } segStart=now; vt=0; }
      const target=clipStart+vt;
      let best=clipFrames[0];
      for (const f of clipFrames){ if (f.t<=target) best=f; else break; }
      dctx.drawImage(best.canvas,0,0,capW,capH);
      setBadge('play','自動再生 '+playSpeed+'x');
      playRaf=requestAnimationFrame(loop);
    }
    playRaf=requestAnimationFrame(loop);
  }

  /* ---------- モード切替 ---------- */
  function clearAll(){ if(recording) stopRecording(); exitDelay(); exitAuto();
    cancelAnimationFrame(rafId); cancelAnimationFrame(playRaf); }
  function setUiMode(m){
    if (m===uiMode) return;
    clearAll(); uiMode=m;
    modeAutoBtn.classList.toggle('on', m==='auto');
    modeRecordBtn.classList.toggle('on', m==='record');
    modeDelayBtn.classList.toggle('on', m==='delay');
    speedsEl.classList.toggle('hidden', !(m==='record'||m==='auto'));
    sensEl.classList.toggle('hidden', m!=='auto');
    delaysEl.classList.toggle('hidden', m!=='delay');
    recBtn.classList.toggle('hidden', m!=='record');
    liveLabel.textContent = m==='record' ? 'ライブ' : (m==='delay' ? '再開' : '待機');
    if (m==='record'){ goLive(); }
    else if (m==='delay'){ enterDelay(); }
    else { enterAuto(); }
  }

  /* ---------- イベント ---------- */
  async function boot(){
    errEl.textContent='';
    try{ await startCamera(); startEl.style.display='none'; }
    catch(e){ errEl.textContent='カメラを起動できませんでした: '+e.message+'（HTTPSまたはlocalhostで開き、カメラを許可してください）'; }
  }
  startBtn.addEventListener('click', boot);
  boot();   // 起動したら即カメラ開始→アドレス検出へ（失敗時は「開始」で再試行）
  modeAutoBtn.addEventListener('click', ()=>setUiMode('auto'));
  modeRecordBtn.addEventListener('click', ()=>setUiMode('record'));
  modeDelayBtn.addEventListener('click', ()=>setUiMode('delay'));

  recBtn.addEventListener('click', ()=>{ if(uiMode!=='record') return; if(recording) stopRecording(); else startRecording(); });
  liveBtn.addEventListener('click', ()=>{
    if (uiMode==='record'){ if(recording) stopRecording(); goLive(); }
    else if (uiMode==='delay'){ exitDelay(); enterDelay(); }
    else { startWaitAddress(); }   // 自動：手動で待機に戻す
  });
  flipBtn.addEventListener('click', async ()=>{ facing=(facing==='environment')?'user':'environment';
    try{ await startCamera(); }catch(e){ hint.textContent='カメラ切替に失敗: '+e.message; } });

  speedBtns.forEach(b=>b.addEventListener('click', ()=>{ speedBtns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
    playSpeed=parseFloat(b.dataset.speed);
    if (recState==='playback'&&uiMode==='record'){ video.playbackRate=playSpeed; setBadge('play','再生中 '+playSpeed+'x'); } }));
  sensBtns.forEach(b=>b.addEventListener('click', ()=>{ sensBtns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
    startThresh=SENS[b.dataset.sens].start; endThresh=startThresh*0.5; }));
  delayBtns.forEach(b=>b.addEventListener('click', ()=>{ delayBtns.forEach(x=>x.classList.remove('on')); b.classList.add('on');
    delayMs=parseInt(b.dataset.delay,10); }));

  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && stream){
    if (uiMode==='record'&&recState==='live') video.play().catch(()=>{});
    else if (uiMode!=='record') video.play().catch(()=>{});
  }});
})();
</script>
